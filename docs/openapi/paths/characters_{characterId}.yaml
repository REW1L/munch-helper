patch:
  tags:
    - Character Management
  summary: Update character
  description: |
    Partial update. Allowed keys are `name`, `avatarId`, `color`, `level`,
    `power`, `class`, `race`, `gender`, `userId`. A successful update emits a
    `character_updated` event with a `changes` map containing only the fields
    whose value actually changed.
  operationId: updateCharacter
  parameters:
    - $ref: ../parameters/CharacterId.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../schemas/UpdateCharacterRequest.yaml
  responses:
    "200":
      description: Character updated
      content:
        application/json:
          schema:
            $ref: ../schemas/Character.yaml
    "400":
      description: Bad request
      content:
        application/json:
          schema:
            $ref: ../schemas/Error.yaml
    "404":
      description: Character not found (also returned for malformed `characterId`).
      content:
        application/json:
          schema:
            $ref: ../schemas/Error.yaml
delete:
  tags:
    - Character Management
  summary: Delete character
  description: |
    Deletes a character. Emits a `character_deleted` event to both buses.
  operationId: deleteCharacter
  parameters:
    - $ref: ../parameters/CharacterId.yaml
  responses:
    "204":
      description: Character deleted (no body).
    "404":
      description: Character not found
      content:
        application/json:
          schema:
            $ref: ../schemas/Error.yaml
