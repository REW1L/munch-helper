get:
  tags:
    - Character Management
  summary: List characters in a room
  description: Returns all characters in a room ordered oldest-first by `createdAt`.
  operationId: getCharacters
  parameters:
    - name: roomId
      in: query
      required: true
      schema:
        type: string
        minLength: 1
  responses:
    "200":
      description: Characters list
      content:
        application/json:
          schema:
            $ref: ../schemas/GetCharactersResponse.yaml
    "400":
      description: Bad request
      content:
        application/json:
          schema:
            $ref: ../schemas/Error.yaml
post:
  tags:
    - Character Management
  summary: Create character
  description: |
    Creates a character in a room. Emits a `character_created` event to both the
    notifications and log buses.
  operationId: createCharacter
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../schemas/CreateCharacterRequest.yaml
  responses:
    "201":
      description: Character created
      content:
        application/json:
          schema:
            $ref: ../schemas/Character.yaml
    "400":
      description: Bad request
      content:
        application/json:
          schema:
            $ref: ../schemas/Error.yaml
