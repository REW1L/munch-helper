patch:
  tags:
    - Battle Management
  summary: Update active battle
  description: Replaces provided battle fields while the battle is active.
  operationId: updateBattle
  parameters:
    - $ref: ../parameters/BattleId.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../schemas/UpdateBattleRequest.yaml
  responses:
    "200":
      description: Battle updated
      content:
        application/json:
          schema:
            $ref: ../schemas/Battle.yaml
    "400":
      description: Bad request
    "404":
      description: Battle not found
    "409":
      description: Battle is not active
delete:
  tags:
    - Battle Management
  summary: Discard active battle
  description: Soft-deletes an active battle by setting its status to discarded.
  operationId: discardBattle
  parameters:
    - $ref: ../parameters/BattleId.yaml
  responses:
    "200":
      description: Battle discarded
      content:
        application/json:
          schema:
            $ref: ../schemas/Battle.yaml
    "404":
      description: Battle not found
    "409":
      description: Battle is not active
