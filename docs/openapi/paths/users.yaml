post:
  tags:
    - User Management
  summary: Create user
  description: Creates a user with the provided nickname and avatar id.
  operationId: createUser
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../schemas/CreateUserRequest.yaml
  responses:
    "201":
      description: User created
      content:
        application/json:
          schema:
            $ref: ../schemas/User.yaml
    "400":
      description: Bad request
      content:
        application/json:
          schema:
            $ref: ../schemas/Error.yaml
