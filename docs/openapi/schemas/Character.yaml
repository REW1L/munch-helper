type: object
required: [id, roomId, userId, name, avatarId, color, level, power, class, race, gender]
properties:
  id:
    type: string
  roomId:
    type: string
  userId:
    type:
      - string
      - "null"
  name:
    type: string
  avatarId:
    type: integer
    description: Avatar id (index into the frontend avatar registry).
  color:
    type: string
    pattern: "^#[0-9A-Fa-f]{6}$"
    description: Hex color code in #RRGGBB format. The server normalizes to upper case.
  level:
    type: integer
  power:
    type: integer
  class:
    type: string
    description: |
      JSON-encoded string array (legacy storage shape). The frontend parses with
      `parseArrayField` and serializes with `serializeArrayField`. Comma-separated
      legacy values are also accepted on read.
  race:
    type: string
    description: JSON-encoded string array; same shape as `class`.
  gender:
    type: string
    description: JSON-encoded string array; same shape as `class`.
  createdAt:
    type: string
    format: date-time
  updatedAt:
    type: string
    format: date-time
