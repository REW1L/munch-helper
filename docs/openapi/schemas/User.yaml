type: object
required: [id, name, avatarId, createdAt, updatedAt]
properties:
  id:
    type: string
    description: Unique id of the user.
  name:
    type: string
    description: Nickname of the user.
  avatarId:
    type: integer
    description: Avatar id of the user (index into the frontend avatar registry).
  createdAt:
    type: string
    format: date-time
  updatedAt:
    type: string
    format: date-time
