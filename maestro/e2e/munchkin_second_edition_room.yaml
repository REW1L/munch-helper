appId: click.helpamunch.mobileapp
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: screenshot-open-rooms
    timeout: 20000
- tapOn:
    id: screenshot-open-rooms
- extendedWaitUntil:
    visible:
      id: create-2e-room-button
    timeout: 15000
- tapOn:
    id: "create-2e-room-button"
- extendedWaitUntil:
    visible:
      id: confirm-create-room-button
    timeout: 10000
- tapOn:
    id: "confirm-create-room-button"
- runFlow:
    when:
      platform: Web
    commands:
      - extendedWaitUntil:
          visible:
            id: Open rules
          timeout: 20000
      - tapOn:
          id: Open rules
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible:
            id: open-room-rules
          timeout: 20000
      - tapOn:
          id: open-room-rules
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible:
            id: open-room-rules
          timeout: 20000
      - tapOn:
          id: open-room-rules
- extendedWaitUntil:
    visible: "Munchkin Second Edition"
    timeout: 10000
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          point: "6%, 9%"
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: Web
    commands:
      - back
- runFlow:
    when:
      platform: Web
    commands:
      - assertVisible:
          id: Open rules
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible:
          id: open-room-rules
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: open-room-rules
- runFlow:
    when:
      platform: Web
    commands:
      - extendedWaitUntil:
          visible: "500 GP"
          timeout: 10000
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: "Gold Pieces: 500"
          timeout: 10000
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: "Gold Pieces: 500"
          timeout: 10000
- tapOn:
    id: change-character-button
- extendedWaitUntil:
    visible:
      id: quick-edit-gold-pieces-input
    timeout: 10000
- takeScreenshot: second-edition-quick-edit
- repeat:
    times: 4
    commands:
      - tapOn:
          id: quick-edit-gold-pieces-decrease
- repeat:
    times: 6
    commands:
      - tapOn:
          id: quick-edit-gold-pieces-increase
- tapOn:
    id: quick-edit-save
- runFlow:
    when:
      platform: Web
    commands:
      - extendedWaitUntil:
          visible: "700 GP"
          timeout: 10000
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: "Gold Pieces: 700"
          timeout: 10000
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: "Gold Pieces: 700"
          timeout: 10000
- takeScreenshot: second-edition-character-card
- tapOn:
    id: change-character-button
- tapOn:
    id: quick-edit-open-full-edit
- extendedWaitUntil:
    visible:
      id: edit-character-gold-pieces-input
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: second-edition-character-edit
- tapOn:
    id: save-character-button
- runFlow:
    when:
      platform: Web
    commands:
      - extendedWaitUntil:
          visible: "700 GP"
          timeout: 10000
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: "Gold Pieces: 700"
          timeout: 10000
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: "Gold Pieces: 700"
          timeout: 10000
