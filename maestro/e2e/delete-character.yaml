appId: click.helpamunch.mobileapp
---
- runFlow: create-character.yaml
- tapOn:
    id: change-character-button
- extendedWaitUntil:
    visible:
      id: change-character-modal
    timeout: 10000
- repeat:
    times: 3
    commands:
      - swipe:
          start: 50%, 70%
          end: 50%, 35%
- assertVisible:
    id: delete-character-button
- tapOn:
    id: delete-character-button
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: confirm-dialog-confirm
    timeout: 5000
- tapOn:
    id: confirm-dialog-confirm
- extendedWaitUntil:
    notVisible: E2E Created
    timeout: 20000
