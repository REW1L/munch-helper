appId: click.helpamunch.mobileapp
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: screenshot-open-rooms
    timeout: 20000
- tapOn:
    id: screenshot-open-rooms
- tapOn:
    id: create-room-button
- tapOn:
    id: confirm-create-room-button
- extendedWaitUntil:
    visible:
      id: open-room-rules
    timeout: 20000
- tapOn:
    id: open-room-rules
- extendedWaitUntil:
    visible:
      id: munchkin-rules-scroll
    timeout: 10000
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          point: "6%, 9%"
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: Web
    commands:
      - back
- assertVisible:
    id: open-room-rules
