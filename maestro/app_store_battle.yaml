appId: click.helpamunch.mobileapp
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Rooms"
    timeout: 20000
- tapOn: "Rooms"
- extendedWaitUntil:
    visible: "Join"
    timeout: 15000
- tapOn: "Join"
- extendedWaitUntil:
    visible: "Join a room for Munchkin?"
    timeout: 10000
- tapOn: "Enter the room name"
- inputText: ${ROOM_ID}
- tapOn: "Join"
- extendedWaitUntil:
    visible: "Rune Rider"
    timeout: 20000
- tapOn:
    point: "50%,15%"
- extendedWaitUntil:
    visible: "Dungeon Door"
    timeout: 20000
- extendedWaitUntil:
    visible: "Player Side"
    timeout: 10000
