name: E2E

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'maestro/**'
      - 'scripts/e2e/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

jobs:
  web:
    name: e2e-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Maestro
        run: curl -Ls https://get.maestro.mobile.dev | bash
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Boot backend stack
        run: npm run e2e:stack:start
      - name: Export and serve web app
        run: |
          EXPO_PUBLIC_API_URL=http://localhost:8080 npm run export:web
          npx serve dist -l 19006 > /tmp/munch-e2e-web-server.log 2>&1 &
          echo $! > /tmp/munch-e2e-web-server.pid
        working-directory: frontend
      - name: Run web flows
        run: |
          node scripts/e2e/prepare-web-flows.mjs --output /tmp/munch-maestro-web --url http://localhost:19006
          for flow in /tmp/munch-maestro-web/*.yaml; do
            eval "$(node scripts/e2e/prepare-room.mjs)"
            node scripts/e2e/cleanup.mjs
            "$HOME/.maestro/bin/maestro" test -p web --headless -e API_URL=http://localhost:8080 -e ROOM_ID="$ROOM_ID" -e USER_ID="$USER_ID" -e ACTOR_B_USER_ID="$ACTOR_B_USER_ID" "$flow"
          done
      - name: Stop web server and browser
        if: always()
        run: node scripts/e2e/cleanup.mjs
      - name: Stop backend stack
        if: always()
        run: npm run e2e:stack:stop

  android:
    name: e2e-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Maestro
        run: curl -Ls https://get.maestro.mobile.dev | bash
      - name: Cache Maestro and Android build
        uses: actions/cache@v4
        with:
          path: |
            ~/.maestro
            frontend/android/.gradle
            ~/.gradle/caches
          key: e2e-android-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json', 'frontend/android/**/*.gradle*') }}
      - name: Install dependencies and boot backend
        run: npm ci && npm ci --prefix frontend && npm run e2e:stack:start
      - name: Start Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          script: echo emulator-ready
      - name: Build Android dev client
        run: EXPO_PUBLIC_API_URL=http://10.0.2.2:8080 EXPO_PUBLIC_E2E=true npx expo run:android --variant release --no-build-cache
        working-directory: frontend
      - name: Run Android flows
        run: |
          for flow in maestro/e2e/*.yaml; do
            eval "$(node scripts/e2e/prepare-room.mjs)"
            node scripts/e2e/cleanup.mjs
            "$HOME/.maestro/bin/maestro" test -p android -e API_URL=http://localhost:8080 -e ROOM_ID="$ROOM_ID" -e USER_ID="$USER_ID" -e ACTOR_B_USER_ID="$ACTOR_B_USER_ID" "$flow"
          done
      - name: Stop backend stack
        if: always()
        run: npm run e2e:stack:stop

  ios:
    name: e2e-ios
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Maestro
        run: curl -Ls https://get.maestro.mobile.dev | bash
      - name: Cache Maestro and iOS build
        uses: actions/cache@v4
        with:
          path: |
            ~/.maestro
            frontend/ios/Pods
            ~/Library/Developer/Xcode/DerivedData
          key: e2e-ios-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json', 'frontend/ios/Podfile.lock') }}
      - name: Install dependencies and boot backend
        run: npm ci && npm ci --prefix frontend && npm run e2e:stack:start
      - name: Build iOS dev client
        run: EXPO_PUBLIC_API_URL=http://localhost:8080 EXPO_PUBLIC_E2E=true npx expo run:ios --configuration Release --no-build-cache
        working-directory: frontend
      - name: Run iOS flows
        run: |
          for flow in maestro/e2e/*.yaml; do
            eval "$(node scripts/e2e/prepare-room.mjs)"
            node scripts/e2e/cleanup.mjs
            "$HOME/.maestro/bin/maestro" test -p ios -e API_URL=http://localhost:8080 -e ROOM_ID="$ROOM_ID" -e USER_ID="$USER_ID" -e ACTOR_B_USER_ID="$ACTOR_B_USER_ID" "$flow"
          done
      - name: Stop backend stack
        if: always()
        run: npm run e2e:stack:stop
